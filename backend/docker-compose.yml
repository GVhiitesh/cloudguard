services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudguard
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: cloudguard
    ports:
      - "5432:5432"
    volumes:
      - cloudguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguard -d cloudguard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cloudguard_pgdata:
