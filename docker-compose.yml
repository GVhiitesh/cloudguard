services:
  backend-1:
    image: cloudguard-backend:baseline
    container_name: cloudguard-backend-1
    restart: unless-stopped
    extra_hosts:
      - "ep-divine-brook-aywnxi6y-pooler.c-5.us-east-2.aws.neon.tech:3.23.109.155"
      - "ep-divine-brook-aywnxi6y.c-5.us-east-2.aws.neon.tech:3.23.109.155"
    environment:
      PORT: 4000
      NODE_ENV: production
      INSTANCE_NAME: backend-1
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      IDLE_CPU_THRESHOLD: 5
      IDLE_WINDOW_DAYS: 10
      ANOMALY_WINDOW_DAYS: 14
      ANOMALY_MIN_ABS_DELTA: 20
      IDLE_FLAG_AFTER_DAYS: 15
      SIMULATOR_ENABLED: "false"
      CORS_ORIGIN: "*"
      LOG_LEVEL: error
    ports:
      - "4001:4000"

  backend-2:
    image: cloudguard-backend:baseline
    container_name: cloudguard-backend-2
    restart: unless-stopped
    extra_hosts:
      - "ep-divine-brook-aywnxi6y-pooler.c-5.us-east-2.aws.neon.tech:3.23.109.155"
      - "ep-divine-brook-aywnxi6y.c-5.us-east-2.aws.neon.tech:3.23.109.155"
    environment:
      PORT: 4000
      NODE_ENV: production
      INSTANCE_NAME: backend-2
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      IDLE_CPU_THRESHOLD: 5
      IDLE_WINDOW_DAYS: 10
      ANOMALY_WINDOW_DAYS: 14
      ANOMALY_MIN_ABS_DELTA: 20
      IDLE_FLAG_AFTER_DAYS: 15
      SIMULATOR_ENABLED: "false"
      CORS_ORIGIN: "*"
      LOG_LEVEL: error
    ports:
      - "4002:4000"

  backend-3:
    image: cloudguard-backend:baseline
    container_name: cloudguard-backend-3
    restart: unless-stopped
    extra_hosts:
      - "ep-divine-brook-aywnxi6y-pooler.c-5.us-east-2.aws.neon.tech:3.23.109.155"
      - "ep-divine-brook-aywnxi6y.c-5.us-east-2.aws.neon.tech:3.23.109.155"
    environment:
      PORT: 4000
      NODE_ENV: production
      INSTANCE_NAME: backend-3
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      IDLE_CPU_THRESHOLD: 5
      IDLE_WINDOW_DAYS: 10
      ANOMALY_WINDOW_DAYS: 14
      ANOMALY_MIN_ABS_DELTA: 20
      IDLE_FLAG_AFTER_DAYS: 15
      SIMULATOR_ENABLED: "false"
      CORS_ORIGIN: "*"
      LOG_LEVEL: error
    ports:
      - "4003:4000"

  nginx:
    image: nginx:alpine
    container_name: cloudguard-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
